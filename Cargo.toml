[package]
name = "any-preview"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Cross-platform document previews and thumbnails for Rust applications"
license = "0BSD"
readme = "README.md"
include = ["Cargo.toml", "README.md", "LICENSE", "CHANGELOG.md", "src/**", "examples/**"]
repository = "https://github.com/anggun-indra/any-preview"
homepage = "https://github.com/anggun-indra/any-preview"
documentation = "https://docs.rs/any-preview"
keywords = ["preview", "document", "thumbnail", "pdf", "office"]

[dependencies]
base64 = "0.22"
csv = "1.3"
hayro = "0.9"
quick-xml = "0.37"
resvg = "0.45.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
